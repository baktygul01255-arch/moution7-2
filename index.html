<title>Равномерное и неравномерное движение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=PT+Sans:wght@400;700&family=PT+Serif:ital@0;1&family=PT+Mono&display=swap">
<style>
.work{min-height:max(560px,62vh)!important;font-size:.85rem!important;border:2px dashed var(--line)}
[hidden]{display:none!important}
/* Layout: школьная тетрадь — красная линия полей, вкладки, слева текст учебника, справа рисунок/модель на клетчатой бумаге */
:root{
  --paper:#f6f7fb; --surface:#ffffff; --ink:#1c2746; --muted:#5b6582; --line:#d8ddea;
  --grid:rgba(60,95,170,.09); --accent:#2d4db3; --accent-soft:#e4e9f9; --margin:#d1475a;
  --ok:#1d8656; --ok-soft:#e1f3ea; --bad:#c13838; --bad-soft:#fbe6e6;
  --c1:#2d4db3; --c2:#c2410c; --c3:#7c3aed; --c4:#15803d;
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"PT Sans","Segoe UI",Arial,sans-serif;
  --f-math:"PT Serif",Georgia,serif;
  --f-mono:"PT Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11162a; --surface:#171e36; --ink:#e5e9f4; --muted:#9aa3bf; --line:#2a3352;
  --grid:rgba(140,170,255,.07); --accent:#93a9ff; --accent-soft:#222c4c; --margin:#ff7c8b;
  --ok:#4fc68f; --ok-soft:#173528; --bad:#ff7b7b; --bad-soft:#3a1e24;
  --c1:#6c84e0; --c2:#d9733c; --c3:#9470dc; --c4:#2fa463; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11162a; --surface:#171e36; --ink:#e5e9f4; --muted:#9aa3bf; --line:#2a3352;
  --grid:rgba(140,170,255,.07); --accent:#93a9ff; --accent-soft:#222c4c; --margin:#ff7c8b;
  --ok:#4fc68f; --ok-soft:#173528; --bad:#ff7b7b; --bad-soft:#3a1e24;
  --c1:#6c84e0; --c2:#d9733c; --c3:#9470dc; --c4:#2fa463; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{font-size:137.5%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;transition:background .2s,color .2s}
.wrap{max-width:min(78rem,100%);margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:relative;padding-block:28px 20px;padding-left:22px;display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:space-between;align-items:flex-start}
header.top::before{content:"";position:absolute;left:0;top:24px;bottom:16px;width:2px;background:var(--margin)}
.htext{flex:1 1 520px;min-width:0}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.sw button{font:inherit;font-size:.85rem;font-weight:700;letter-spacing:.04em;border:0;background:none;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sw svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,4.6vw,3rem);line-height:1.08;margin:.25em 0 .2em;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.lead{max-width:64ch;color:var(--muted);margin:0}
h2{font-family:var(--f-display);font-size:1.5rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:1.2rem;margin:0}
p{margin:0}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:22px}
nav.tabs button{font:inherit;font-weight:700;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:12px 14px 10px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.m{font-family:var(--f-math);white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.12;margin:0 .08em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .18em}
.fr>span:last-child{padding:0 .18em}
.paper-grid{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:10px}
svg.plot{display:block;width:100%;height:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.duo.wideR{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
@media (max-width:980px){.duo,.duo.wideR{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px}
.defn{border:1.5px solid var(--ink);border-radius:14px;padding:10px 14px;line-height:1.6}
.fblock{display:block;text-align:center;font-family:var(--f-math);font-size:1.18em;margin-top:6px}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 14px;line-height:1.6}
.ex{border-left:3px solid var(--margin);padding-left:12px;line-height:1.7}
.ex .lbl{display:block;margin-bottom:2px}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;line-height:1.55}
.lbl{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:var(--f-math);font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
thead th{color:var(--muted);font-weight:400}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer;line-height:1.4}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip{font-family:var(--f-math);font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--paper);border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1.5px solid var(--accent)}
.btn.sm{padding:5px 12px;font-size:.9rem}
select,input.num{font:inherit;font-family:var(--f-math);padding:4px 8px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);max-width:100%}
input.num{width:6em}
input[type=range]{width:100%;accent-color:var(--accent)}
.sl{display:grid;grid-template-columns:minmax(4em,auto) 1fr 5.5em;gap:10px;align-items:center}
.sl .vl{font-family:var(--f-math);text-align:right}
.big{font-family:var(--f-math);font-size:1.35rem;line-height:1.7}
.eq{font-family:var(--f-math);font-size:1.6rem;line-height:1.6}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:grid;grid-template-columns:2em 1fr;gap:10px;align-items:start;counter-increment:st}
.steps li::before{content:counter(st);font-family:var(--f-mono);font-size:.85rem;color:var(--paper);background:var(--accent);border-radius:50%;width:1.7em;height:1.7em;display:grid;place-items:center;margin-top:.2em}
.steps .why{color:var(--muted);font-size:.92rem;display:block}
.steps .mx{font-family:var(--f-math);font-size:1.2rem;line-height:1.9;overflow-x:auto;display:block}
.sMode{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;margin:6px 0 12px;cursor:pointer}
.sMode input{width:1.2em;height:1.2em;accent-color:var(--accent)}
.work{border:2px dashed var(--line);border-radius:12px;min-height:220px;padding:12px 16px;color:var(--muted);font-size:.95rem;margin-bottom:14px}
#sCheck .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px}
#sCheck .fb{font-weight:700;margin:6px 0 12px}
#sCheck .fb.ok{color:var(--ok)}#sCheck .fb.bad{color:var(--bad)}
#sCtl .btn[disabled]{opacity:.4;cursor:default}
@media (max-width:700px){#sCheck .opts{grid-template-columns:1fr}}
.answer{border:2px solid var(--ok);background:var(--ok-soft);border-radius:10px;padding:10px 14px;font-family:var(--f-math);font-size:1.3rem;line-height:1.8}
.answer.none{border-color:var(--bad);background:var(--bad-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}
.qwrap{max-width:880px}
.stat{font-family:var(--f-mono);font-size:.9rem;color:var(--muted)}
.stat b{color:var(--ink);font-weight:400}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qcat{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.qtext{font-size:1.2rem;line-height:1.6}
.qtext .m{font-size:1.12em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.opt{font:inherit;font-family:var(--f-math);font-size:1.08rem;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center;min-height:2.6em;line-height:1.6}
.opt .k{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{border-radius:8px;padding:12px 14px;font-size:1rem;line-height:1.8}
.expl.ok{background:var(--ok-soft)} .expl.no{background:var(--bad-soft)}
.expl b{display:block;margin-bottom:2px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);transition:width .3s}
.score{font-family:var(--f-display);font-size:3rem;line-height:1}
.review{display:flex;flex-direction:column;gap:12px}
.review > div{border-left:3px solid var(--bad);padding:4px 0 4px 12px;line-height:1.7;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>

.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.sim{grid-template-columns:1fr}}
canvas.vessel{display:block;width:100%;height:auto;border-radius:10px}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:8px}
.readout>div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper)}
.readout .k{display:block;font-size:.8rem;color:var(--muted);font-weight:700}
.readout .v{font-family:var(--f-math);font-size:1.25rem}
.status{border-radius:10px;padding:10px 14px;font-weight:700;line-height:1.5}
.status.sat{background:var(--accent-soft);color:var(--accent)}
.status.uns{background:var(--ok-soft);color:var(--ok)}
.status.cond{background:var(--bad-soft);color:var(--bad)}
.flux{display:grid;grid-template-columns:auto 1fr 4.5em;gap:6px 10px;align-items:center;font-size:.9rem}
.flux .bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.flux .bar i{display:block;height:100%;border-radius:7px;transition:width .15s}
.obs{counter-reset:o;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.obs li{counter-increment:o;display:grid;grid-template-columns:1.8em 1fr;gap:8px;line-height:1.5}
.obs li::before{content:counter(o);font-family:var(--f-mono);font-size:.8rem;background:var(--accent-soft);color:var(--accent);border-radius:50%;width:1.6em;height:1.6em;display:grid;place-items:center;margin-top:.1em}
.cmp td,.cmp th{white-space:normal;text-align:left;font-family:var(--f-body);vertical-align:top;line-height:1.45}
.cmp th:first-child{color:var(--muted)}
.pin{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.pin input{width:8em;font-size:1.2rem}
.fb.ok{color:var(--ok);font-weight:700}.fb.bad{color:var(--bad);font-weight:700}
.prob{font-size:1.15rem;line-height:1.7}
.tcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.tcard{grid-template-columns:1fr}}
.cap{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}

.track{display:block;width:100%;height:auto}
.ctrlrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.seg-row .no{font-family:var(--f-mono);font-size:.85rem;background:var(--accent-soft);color:var(--accent);border-radius:50%;width:1.8em;height:1.8em;display:grid;place-items:center}
.seg-row .flds{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.seg-row input.num{width:5em}
.seg-row .x{font:inherit;border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.3rem;padding:2px 8px;border-radius:6px}
.seg-row .x:hover{background:var(--bad-soft);color:var(--bad)}
.hl td{background:var(--accent-soft)}
td.dim{color:var(--muted)}
.qtext svg{max-width:680px;display:block;margin-top:10px}
.prob svg{max-width:680px;display:block;margin-top:10px}
</style>

<div class="wrap">
  <header class="top">
    <div class="htext">
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="lead"></p>
    </div>
    <div class="ctrls">
      <div class="sw" id="langSw" role="group" aria-label="Тіл / Язык"><button data-lang="ru">РУС</button><button data-lang="kz">ҚАЗ</button></div>
      <div class="sw" id="sizeSw" role="group" aria-label="Размер шрифта"><button data-sz="16">A</button><button data-sz="22">A+</button><button data-sz="28">A++</button></div>
      <div class="sw" id="themeSw" role="group" aria-label="Тема">
        <button data-th="light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i="light"></span></button>
        <button data-th="dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span data-i="dark"></span></button>
      </div>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="t-theory" data-tab="theory" data-i="tTheory"></button>
    <button role="tab" id="t-race" data-tab="race" data-i="tRace"></button>
    <button role="tab" id="t-avg" data-tab="avg" data-i="tAvg"></button>
    <button role="tab" id="t-prob" data-tab="prob" data-i="tProb"></button>
    <button role="tab" id="t-train" data-tab="train" data-i="tTrain"></button>
    <button role="tab" id="t-test" data-tab="test" data-i="tTest"></button>
  </nav>
  <main>
  <div id="p-theory" class="pane"><div class="stack" id="theoryBox"></div></div>

  <div id="p-race" class="pane" hidden>
    <div class="card" style="margin-bottom:18px">
      <div class="row"><span class="lbl" data-i="raceL"></span></div>
      <div class="paper-grid"><svg id="trackSvg" class="track" viewBox="0 0 1000 300" role="img" aria-label="track"></svg></div>
      <div class="row">
        <button class="btn" id="rPlay"></button><button class="btn ghost" id="rStep" data-i="step1"></button><button class="btn ghost" id="rReset" data-i="reset"></button>
        <span class="big" id="rTime"></span>
      </div>
      <div class="duo">
        <div class="stack" style="gap:8px">
          <div class="sl"><span style="color:var(--c1);font-weight:700" data-i="vAL"></span><input type="range" id="rVA" min="2" max="10" step="0.5" value="8" aria-label="vA"><span class="vl" id="rVAv"></span></div>
        </div>
        <div class="row"><span style="color:var(--c2);font-weight:700" data-i="modeBL"></span><div class="seg" id="rMode"></div></div>
      </div>
    </div>
    <div class="duo">
      <div class="stack">
        <div class="card"><span class="lbl" data-i="stL"></span><div class="paper-grid"><svg id="rST" class="plot" viewBox="0 0 620 380" role="img"></svg></div></div>
        <div class="card"><span class="lbl" data-i="vtL"></span><div class="paper-grid"><svg id="rVT" class="plot" viewBox="0 0 620 300" role="img"></svg></div><div class="legend" id="rLeg"></div></div>
      </div>
      <div class="stack">
        <div class="card"><div class="readout" id="rRead"></div><div id="rNote" class="note"></div></div>
        <div class="card"><span class="lbl" data-i="tblL"></span><div class="tbl-wrap"><table id="rTbl"></table></div></div>
      </div>
    </div>
  </div>

  <div id="p-avg" class="pane" hidden>
    <div class="duo">
      <div class="stack">
        <div class="card">
          <span class="lbl" data-i="avgPreL"></span>
          <div class="seg" id="aPre"></div>
        </div>
        <div class="card">
          <span class="lbl" data-i="avgSegL"></span>
          <div id="aSegs" class="stack" style="gap:10px"></div>
          <div class="row"><button class="btn ghost sm" id="aAdd" data-i="addSeg"></button></div>
          <p style="color:var(--muted);font-size:.9rem" data-i="avgHint"></p>
        </div>
        <div class="card">
          <span class="lbl" data-i="avgTaskL"></span>
          <div class="prob" id="aTask"></div>
          <label class="sMode"><input type="checkbox" class="teach"> <span data-i="sAllL"></span></label>
          <div id="aSolve"></div>
        </div>
      </div>
      <div class="stack">
        <div class="card"><span class="lbl" data-i="avgVTL"></span><div class="paper-grid"><svg id="aVT" class="plot" viewBox="0 0 620 340" role="img"></svg></div><div class="legend" id="aLegV"></div></div>
        <div class="card"><span class="lbl" data-i="avgSTL"></span><div class="paper-grid"><svg id="aST" class="plot" viewBox="0 0 620 340" role="img"></svg></div><div class="legend" id="aLegS"></div></div>
      </div>
    </div>
  </div>

  <div id="p-prob" class="pane" hidden>
    <div class="duo wideR">
      <div class="stack">
        <div class="card">
          <span class="lbl" data-i="pTypeL"></span>
          <div class="seg" id="prCat"></div>
          <div class="row"><button class="btn" id="prNew" data-i="prNew"></button></div>
          <label class="sMode"><input type="checkbox" class="teach"> <span data-i="sAllL"></span></label>
        </div>
        <div class="card"><span class="lbl" data-i="constL"></span><div id="prConst" style="line-height:1.8"></div></div>
      </div>
      <div class="stack">
        <div class="card">
          <span class="lbl" id="prCatL"></span>
          <div class="prob" id="prText"></div>
          <div id="prSolve"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="p-train" class="pane" hidden>
    <div class="qwrap">
      <div class="row" style="margin-bottom:14px"><div class="seg" id="trCat"></div></div>
      <div class="row" style="margin-bottom:14px">
        <span class="stat"><span data-i="sDone"></span>: <b id="sDone">0</b></span>
        <span class="stat"><span data-i="sOk"></span>: <b id="sOk">0</b></span>

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=Math.random;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));

const newSeed=()=>Math.floor(Math.random()*2**31);
function withSeed(seed,fn){const p=rnd;rnd=mulberry(seed);try{return fn();}finally{rnd=p;}}
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};

function trimN(x,d){let s=x.toFixed(d);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');return s;}
function fmt(x,sig=3){if(!isFinite(x))return'—';if(x===0)return'0';const a=Math.abs(x);
  if(a>=1e5||a<1e-3){let e=Math.floor(Math.log10(a));let m=x/10**e;if(Math.abs(Math.round(m*100)/100)>=10){m/=10;e++;}return (trimN(m,sig-1).replace('.',',')+'·10'+sup(e)).replace('-','−');}
  const d=Math.max(0,sig-1-Math.floor(Math.log10(a)));return trimN(x,d).replace('.',',').replace('-','−');}
const frac=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const M_=s=>`<span class="m">${s}</span>`;

function mkPlot(svg,o){const W=o.W,H=o.H,pl=o.pl||64,pr=o.pr||20,pt=o.pt||20,pb=o.pb||46;
  const X=x=>pl+(x-o.x0)/(o.x1-o.x0)*(W-pl-pr), Y=y=>H-pb-(y-o.y0)/(o.y1-o.y0)*(H-pt-pb);return{X,Y,W,H,pl,pr,pt,pb};}
function axes(svg,P,o){const{X,Y}=P;

  txt(svg,o.xl,X(o.x1),Y(o.y0)-10,{'text-anchor':'end','font-size':18,'font-style':'italic',fill:'var(--muted)'});

function path(svg,pts,a){if(!pts.length)return;el('path',Object.assign({d:'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L'),fill:'none','stroke-width':3,'stroke-linejoin':'round'},a),svg);}

const nice=(mx,n=6)=>{const st=[0.1,0.2,0.25,0.5,1,2,5,10,20,25,50,100,200,250,500,1000];return st.find(s=>mx/s<=n)||1000;};
const ticks=(a,b,s)=>{const r=[];for(let v=a;v<=b+1e-9;v+=s)r.push(Math.round(v*1e6)/1e6);return r;};
const close=(x,y,tol)=>Math.abs(x-y)<=Math.max(Math.abs(y)*tol,1e-9);
const parseNum=s=>{s=String(s).replace(/\s/g,'').replace(',','.').replace('−','-');if(s===''||!isFinite(+s))return null;return +s;};

const UI=()=>({

  avgHint:L('Для каждого участка задайте две величины — третью ученик находит сам. Единицы: км, ч, км/ч. Стоянка — участок со скоростью 0.','Әр бөлікке екі шаманы беріңіз — үшіншісін оқушы өзі табады. Өлшем бірліктері: км, сағ, км/сағ. Аялдама — жылдамдығы 0 бөлік.'),

function solveUI(root,st,P,redraw,work){
  const N=P.steps.length,n=TEACH?N:Math.min(st.shown,N),ansOn=TEACH||st.ans||n>=N;
  const solved=st.tries.some(v=>close(v,P.ans,P.tol||.01));const last=st.tries[st.tries.length-1];
  root.innerHTML=(work?`<div class="work paper-grid">${L('Место для решения: включите ручку ✎ (справа внизу) и решайте прямо здесь. Затем введите ответ и нажмите «Проверить».','Шешуге арналған орын: қаламды ✎ (оң жақ төменде) қосып, осы жерде шешіңіз. Содан кейін жауапты енгізіп, «Тексеру» батырмасын басыңыз.')}</div>`:'')+
    (TEACH?'':`<span class="lbl">${L('Ваш ответ','Сіздің жауабыңыз')}</span><div class="pin"><input class="num" inputmode="decimal" placeholder="?" value="${last!==undefined?String(last).replace('.',','):''}" ${solved?'disabled':''}><span class="m">${P.unit}</span><button class="btn go" ${solved?'disabled':''}>${L('Проверить','Тексеру')}</button></div>`+
    (last===undefined?'':solved?`<p class="fb ok">${L('Верно!','Дұрыс!')} ${st.tries.length===1?L('С первой попытки.','Бірінші әрекеттен.'):''}</p>`:`<p class="fb bad">${(P.trap&&close(last,P.trap.v,.01))?P.trap.msg:L('Пока неверно. Проверьте вычисления и единицы измерения или откройте подсказку.','Әзірге қате. Есептеулер мен өлшем бірліктерін тексеріңіз немесе кеңесті ашыңыз.')} (${L('попыток','әрекет')}: ${st.tries.length})</p>`))+
    `<ol class="steps" style="margin-top:12px">${P.steps.slice(0,n).map(s=>`<li><div><span class="why">${s.why}</span><span class="mx">${s.mx}</span></div></li>`).join('')}</ol>`+
    (ansOn?`<div class="answer" style="margin-top:12px">${L('Ответ','Жауабы')}: ${P.ansH||fmt(P.ans)+' '+P.unit}</div>`:'')+
    (TEACH?'':`<div class="row" style="margin-top:14px"><button class="btn ghost" data-c="next" ${n>=N?'disabled':''}>${L('Подсказка: следующий шаг','Кеңес: келесі қадам')} (${Math.min(n+1,N)}/${N})</button>${ansOn?'':`<button class="btn ghost" data-c="ans">${L('Показать ответ','Жауапты көрсету')}</button><button class="btn ghost" data-c="all">${L('Всё решение','Толық шешім')}</button>`}</div>`);

  if(inp){const go=()=>{const v=parseNum(inp.value);if(v===null)return;st.tries.push(v);redraw();};root.querySelector('.go').addEventListener('click',go);inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});}
  root.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;const c=b.dataset.c;if(c==='next')st.shown++;else if(c==='ans')st.ans=true;else{st.shown=99;st.ans=true;}redraw();}));
}

function renderTheory(){

    <div class="defn">${L('<b>Механическое движение</b> — изменение положения тела относительно других тел с течением времени. Линия, по которой движется тело, — <b>траектория</b>, её длина — <b>путь s</b>. Если траектория — прямая линия, движение называют <b>прямолинейным</b>.','<b>Механикалық қозғалыс</b> — дененің басқа денелерге қатысты орнының уақыт өте келе өзгеруі. Дене қозғалатын сызық — <b>траектория</b>, оның ұзындығы — <b>жол s</b>. Траектория түзу сызық болса, қозғалыс <b>түзусызықты</b> деп аталады.')}</div>
    <div class="duo">
      <div class="defn">${L('<b>Равномерное движение</b> — движение, при котором тело за <b>любые равные</b> промежутки времени проходит <b>одинаковые</b> пути.','<b>Бірқалыпты қозғалыс</b> — дене <b>кез келген тең</b> уақыт аралықтарында <b>бірдей</b> жол жүретін қозғалыс.')}<br><span style="color:var(--muted)">${L('Пример: эскалатор, поезд на прямом участке с постоянной скоростью.','Мысал: эскалатор, тұрақты жылдамдықпен түзу жолмен жүрген пойыз.')}</span></div>
      <div class="defn">${L('<b>Неравномерное движение</b> — движение, при котором тело за равные промежутки времени проходит <b>разные</b> пути.','<b>Бірқалыпсыз қозғалыс</b> — дене тең уақыт аралықтарында <b>әр түрлі</b> жол жүретін қозғалыс.')}<br><span style="color:var(--muted)">${L('Пример: автобус в городе, бегун на старте, падающий мяч.','Мысал: қаладағы автобус, мәредегі жүгіруші, құлап бара жатқан доп.')}</span></div>
    </div>
    ${fig('fSt','0 0 960 265',L('Рис. 1. Положения тел через каждую секунду','1-сурет. Денелердің әр секунд сайынғы орындары'))}
  </div></div>

  <div class="card tcard"><div class="stack">
    <h2>${L('2. Скорость равномерного движения','2. Бірқалыпты қозғалыс жылдамдығы')}</h2>
    <div class="defn">${L('<b>Скорость равномерного движения</b> — физическая величина, равная отношению пути ко времени, за которое этот путь пройден.','<b>Бірқалыпты қозғалыс жылдамдығы</b> — жолдың осы жолды жүруге кеткен уақытқа қатынасына тең физикалық шама.')}
      <span class="fblock">v = ${frac('s','t')}, &nbsp;&nbsp; s = vt, &nbsp;&nbsp; t = ${frac('s','v')}</span></div>
    <p>${L('Скорость показывает, какой путь проходит тело за единицу времени. Скорость — <b>векторная</b> величина: кроме числового значения она имеет направление.','Жылдамдық дененің уақыт бірлігінде қандай жол жүретінін көрсетеді. Жылдамдық — <b>векторлық</b> шама: сан мәнінен басқа оның бағыты бар.')}</p>
    <div class="note">${L('Единица скорости в СИ — <b>1 м/с</b>.','ХБЖ-дағы жылдамдық бірлігі — <b>1 м/с</b>.')}<span class="fblock">1 ${KMH()} = ${frac('1000 '+L('м','м'),'3600 '+L('с','с'))} = ${frac('1','3,6')} ${L('м/с','м/с')}; &nbsp; 1 ${L('м/с','м/с')} = 3,6 ${KMH()}</span>
      <span style="display:block;margin-top:6px">${L('км/ч → м/с: делим на 3,6 (72 км/ч = 20 м/с). м/с → км/ч: умножаем на 3,6 (15 м/с = 54 км/ч).','км/сағ → м/с: 3,6-ға бөлеміз (72 км/сағ = 20 м/с). м/с → км/сағ: 3,6-ға көбейтеміз (15 м/с = 54 км/сағ).')}</span></div>
  </div><div class="stack"><span class="lbl">${L('Скорости некоторых тел, м/с','Кейбір денелердің жылдамдығы, м/с')}</span><div class="tbl-wrap"><table class="cmp"><tbody>${SPEEDS().map(([a,b])=>`<tr><td>${a}</td><td style="text-align:right;font-family:var(--f-math)">${b}</td></tr>`).join('')}</tbody></table></div></div></div>

  <div class="card tcard"><div class="stack">
    <h2>${L('3. Графики равномерного движения','3. Бірқалыпты қозғалыс графиктері')}</h2>
    <ul class="clean">
      <li>${L('<b>График пути s(t)</b> — прямая, выходящая из начала координат. Чем больше скорость, тем круче график.','<b>Жол графигі s(t)</b> — координаттар басынан шығатын түзу. Жылдамдық неғұрлым көп болса, график соғұрлым тік.')}</li>
      <li>${L('<b>График скорости v(t)</b> — прямая, параллельная оси времени.','<b>Жылдамдық графигі v(t)</b> — уақыт осіне параллель түзу.')}</li>
      <li>${L('Путь численно равен <b>площади</b> фигуры под графиком скорости.','Жол жылдамдық графигінің астындағы фигураның <b>ауданына</b> сан жағынан тең.')}</li>
      <li>${L('По графику s(t) скорость находят так: берут любую точку графика и делят путь на время: v = s : t.','s(t) графигі бойынша жылдамдықты былай табады: графиктің кез келген нүктесін алып, жолды уақытқа бөледі: v = s : t.')}</li>
    </ul>
  </div><div class="stack">${fig('fST','0 0 460 300',L('Рис. 2. Графики пути при разных скоростях','2-сурет. Әр түрлі жылдамдықтағы жол графиктері'))}${fig('fVT','0 0 460 260',L('Рис. 3. Путь = площадь под графиком v(t)','3-сурет. Жол = v(t) графигі астындағы аудан'))}</div></div>

  <div class="card tcard"><div class="stack">
    <h2>${L('4. Средняя скорость неравномерного движения','4. Бірқалыпсыз қозғалыстың орташа жылдамдығы')}</h2>
    <div class="defn">${L('<b>Средняя скорость</b> неравномерного движения равна отношению <b>всего</b> пройденного пути ко <b>всему</b> времени движения (включая остановки).','Бірқалыпсыз қозғалыстың <b>орташа жылдамдығы</b> жүрілген <b>барлық</b> жолдың қозғалыстың <b>барлық</b> уақытына (аялдамаларды қоса) қатынасына тең.')}
      <span class="fblock">v<sub>${L('ср','орт')}</sub> = ${frac('s<sub>1</sub> + s<sub>2</sub> + … + s<sub>n</sub>','t<sub>1</sub> + t<sub>2</sub> + … + t<sub>n</sub>')}</span></div>
    <p class="note" style="border-left:4px solid var(--bad)">${L('<b>Внимание!</b> Средняя скорость, как правило, <b>не равна</b> среднему арифметическому скоростей. Половину пути автомобиль ехал со скоростью 60 км/ч, половину — 40 км/ч. Средняя скорость — 48 км/ч, а не 50 км/ч: на медленном участке он ехал дольше.','<b>Назар аударыңыз!</b> Орташа жылдамдық, әдетте, жылдамдықтардың арифметикалық ортасына <b>тең емес</b>. Жолдың жартысын автомобиль 60 км/сағ, жартысын 40 км/сағ жылдамдықпен жүрді. Орташа жылдамдық 50 км/сағ емес, 48 км/сағ: баяу бөлікте ол ұзағырақ жүрді.')}</p>
    <p>${L('Пример. Автобус 1 ч ехал со скоростью 90 км/ч, 0,5 ч стоял, затем 1 ч ехал со скоростью 60 км/ч. s = 90 + 0 + 60 = 150 км, t = 1 + 0,5 + 1 = 2,5 ч, v<sub>ср</sub> = 150 : 2,5 = 60 км/ч.','Мысал. Автобус 1 сағ 90 км/сағ жылдамдықпен жүрді, 0,5 сағ тұрды, сосын 1 сағ 60 км/сағ жылдамдықпен жүрді. s = 90 + 0 + 60 = 150 км, t = 1 + 0,5 + 1 = 2,5 сағ, v<sub>орт</sub> = 150 : 2,5 = 60 км/сағ.')}</p>
  </div>${fig('fAvg','0 0 460 300',L('Рис. 4. Неравномерное движение и средняя скорость','4-сурет. Бірқалыпсыз қозғалыс және орташа жылдамдық'))}</div>`;
  figStrobe($('#fSt'));figST($('#fST'));figVT($('#fVT'));figAvg($('#fAvg'));
}

/* ================= МОДЕЛЬ: ГОНКА ================= */
const TMAX=10, SMAX=100;
const BM={
  acc:{n:()=>L('разгоняется','үдейді'),v:t=>2*t,s:t=>t*t},
  brake:{n:()=>L('тормозит','тежеледі'),v:t=>Math.max(0,18-1.8*t),s:t=>{t=Math.min(t,10);return 18*t-0.9*t*t;}},
  stop:{n:()=>L('едет с остановкой','аялдамамен жүреді'),v:t=>t<3?12:t<5?0:10,s:t=>t<3?12*t:t<5?36:36+10*(t-5)},
  wave:{n:()=>L('то быстрее, то медленнее','бірде тез, бірде баяу'),v:t=>8+5*Math.sin(t*1.3),s:t=>8*t+5/1.3*(1-Math.cos(t*1.3))}};
const RC={t:0,run:false,vA:8,mode:'acc',last:0};
const sA=t=>RC.vA*t;
function drawTrack(){const svg=$('#trackSvg');svg.innerHTML='';const X=s=>70+s/SMAX*870;
  [[90,'var(--c1)','A',sA],[210,'var(--c2)','B',BM[RC.mode].s]].forEach(([y,c,lab,f])=>{
    el('rect',{x:X(0)-10,y:y-34,width:X(SMAX)-X(0)+20,height:68,rx:8,fill:'var(--accent-soft)','fill-opacity':.5},svg);
    el('line',{x1:X(0),x2:X(SMAX),y1:y+26,y2:y+26,stroke:'var(--muted)','stroke-width':2},svg);
    for(let m=0;m<=SMAX;m+=10){el('line',{x1:X(m),x2:X(m),y1:y+20,y2:y+32,stroke:'var(--muted)'},svg);if(lab==='B')txt(svg,m+'',X(m),y+54,{'text-anchor':'middle','font-size':14,fill:'var(--muted)'});}
    for(let k=0;k<=Math.floor(RC.t+1e-9);k++){const s=f(k);el('circle',{cx:X(s),cy:y+26,r:6,fill:c},svg);}
    const s=f(RC.t);const g=el('g',{transform:`translate(${X(s)},${y})`},svg);
    el('rect',{x:-46,y:-20,width:46,height:24,rx:6,fill:c},g);el('rect',{x:-34,y:-32,width:24,height:14,rx:4,fill:c,'fill-opacity':.75},g);
    el('circle',{cx:-36,cy:5,r:7,fill:'var(--ink)'},g);el('circle',{cx:-10,cy:5,r:7,fill:'var(--ink)'},g);
    txt(g,lab,-23,-3,{'text-anchor':'middle','font-size':16,'font-weight':'bold',fill:'#fff','font-family':'PT Sans, Arial'});});
  txt(svg,L('s, м','s, м'),X(0)-26,264,{'font-size':15,fill:'var(--muted)','font-style':'italic'});
  el('line',{x1:X(0),x2:X(0),y1:40,y2:260,stroke:'var(--ok)','stroke-width':3},svg);txt(svg,L('старт','мәре'),X(0),30,{'text-anchor':'middle','font-size':15,fill:'var(--ok)'});}
function drawRaceGraphs(){const fB=BM[RC.mode];
  let svg=$('#rST');svg.innerHTML='';let P=mkPlot(svg,{x0:0,x1:10,y0:0,y1:SMAX,W:620,H:380,pl:60});
  axes(svg,P,{x0:0,x1:10,y0:0,y1:SMAX,xt:ticks(0,10,1),yt:ticks(0,100,20),xl:'t, '+L('с','с'),yl:'s, '+L('м','м')});
  const curve=(f,t1)=>{const a=[];for(let t=0;t<=t1+1e-9;t+=0.05)a.push([P.X(t),P.Y(Math.min(f(t),SMAX))]);a.push([P.X(t1),P.Y(Math.min(f(t1),SMAX))]);return a;};
  path(svg,curve(sA,TMAX),{stroke:'var(--c1)','stroke-opacity':.25});path(svg,curve(fB.s,TMAX),{stroke:'var(--c2)','stroke-opacity':.25});
  if(RC.t>0){path(svg,curve(sA,RC.t),{stroke:'var(--c1)'});path(svg,curve(fB.s,RC.t),{stroke:'var(--c2)'});
    path(svg,[[P.X(0),P.Y(0)],[P.X(RC.t),P.Y(fB.s(RC.t))]],{stroke:'var(--c2)','stroke-dasharray':'6 6','stroke-width':2});}
  el('line',{x1:P.X(RC.t),x2:P.X(RC.t),y1:P.Y(0),y2:P.Y(SMAX),stroke:'var(--muted)','stroke-dasharray':'3 4'},svg);
  [[sA,'var(--c1)'],[fB.s,'var(--c2)']].forEach(([f,c])=>el('circle',{cx:P.X(RC.t),cy:P.Y(Math.min(f(RC.t),SMAX)),r:7,fill:c},svg));
  svg=$('#rVT');svg.innerHTML='';P=mkPlot(svg,{x0:0,x1:10,y0:0,y1:20,W:620,H:300,pl:60});
  axes(svg,P,{x0:0,x1:10,y0:0,y1:20,xt:ticks(0,10,1),yt:ticks(0,20,5),xl:'t, '+L('с','с'),yl:'v, '+L('м/с','м/с')});
  const cv=(f,t1)=>{const a=[];for(let t=0;t<=t1+1e-9;t+=0.02)a.push([P.X(t),P.Y(f(t))]);return a;};
  path(svg,cv(()=>RC.vA,TMAX),{stroke:'var(--c1)','stroke-opacity':.25});path(svg,cv(fB.v,TMAX),{stroke:'var(--c2)','stroke-opacity':.25});
  if(RC.t>0){path(svg,cv(()=>RC.vA,RC.t),{stroke:'var(--c1)'});path(svg,cv(fB.v,RC.t),{stroke:'var(--c2)'});
    const vav=fB.s(RC.t)/RC.t;path(svg,[[P.X(0),P.Y(vav)],[P.X(RC.t),P.Y(vav)]],{stroke:'var(--c2)','stroke-dasharray':'6 6','stroke-width':2});}
  el('line',{x1:P.X(RC.t),x2:P.X(RC.t),y1:P.Y(0),y2:P.Y(20),stroke:'var(--muted)','stroke-dasharray':'3 4'},svg);
  $('#rLeg').innerHTML=`<span><i style="background:var(--c1)"></i>A: ${L('равномерно','бірқалыпты')}</span><span><i style="background:var(--c2)"></i>B: ${fB.n()}</span><span style="color:var(--muted)">- - - ${L('средняя скорость B','B орташа жылдамдығы')}</span>`;}
function drawRaceInfo(){const fB=BM[RC.mode],t=RC.t;
  $('#rTime').textContent='t = '+fmt(Math.round(t*10)/10,2).replace(/^(\d+)$/,'$1,0')+' '+L('с','с');
  $('#rPlay').textContent=RC.run?L('❚❚ Пауза','❚❚ Үзіліс'):(t>=TMAX?L('▶ Ещё раз','▶ Қайта'):L('▶ Пуск','▶ Бастау'));
  $('#rVAv').textContent=fmt(RC.vA)+' '+L('м/с','м/с');
  $('#rMode').innerHTML=Object.entries(BM).map(([k,m])=>`<button data-m="${k}" aria-pressed="${k===RC.mode}">${m.n()}</button>`).join('');
  const r=[['s<sub>A</sub>',fmt(sA(t),3)+' '+L('м','м')],['v<sub>A</sub>',fmt(RC.vA)+' '+L('м/с','м/с')],['s<sub>B</sub>',fmt(fB.s(t),3)+' '+L('м','м')],['v<sub>B</sub> '+L('сейчас','қазір'),fmt(fB.v(t),2)+' '+L('м/с','м/с')],['v<sub>'+L('ср','орт')+' B</sub> = s<sub>B</sub>/t',t>0?fmt(fB.s(t)/t,3)+' '+L('м/с','м/с'):'—']];
  $('#rRead').innerHTML=r.map(([k,v])=>`<div><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  $('#rNote').innerHTML=t<TMAX?L('Сравните пути, пройденные за каждую секунду: у A они одинаковые, у B — разные.','Әр секундта жүрілген жолдарды салыстырыңыз: A-да олар бірдей, B-да — әр түрлі.')
    :L(`Финиш через 10 с. A прошёл ${fmt(sA(10),3)} м со скоростью ${fmt(RC.vA)} м/с. B прошёл ${fmt(fB.s(10),3)} м, его средняя скорость v<sub>ср</sub> = ${fmt(fB.s(10),3)} : 10 = ${fmt(fB.s(10)/10,3)} м/с.`,`10 с өтті. A ${fmt(RC.vA)} м/с жылдамдықпен ${fmt(sA(10),3)} м жүрді. B ${fmt(fB.s(10),3)} м жүрді, оның орташа жылдамдығы v<sub>орт</sub> = ${fmt(fB.s(10),3)} : 10 = ${fmt(fB.s(10)/10,3)} м/с.`);
  const k0=Math.floor(t+1e-9);
  $('#rTbl').innerHTML=`<thead><tr><th>t, ${L('с','с')}</th><th style="color:var(--c1)">s<sub>A</sub>, ${L('м','м')}</th><th style="color:var(--c1)">Δs<sub>A</sub></th><th style="color:var(--c2)">s<sub>B</sub>, ${L('м','м')}</th><th style="color:var(--c2)">Δs<sub>B</sub></th></tr></thead><tbody>`+
    ticks(1,10,1).map(k=>k<=k0?`<tr class="${k===k0?'hl':''}"><td>${k}</td><td>${fmt(sA(k),3)}</td><td>${fmt(sA(k)-sA(k-1),3)}</td><td>${fmt(fB.s(k),3)}</td><td>${fmt(fB.s(k)-fB.s(k-1),3)}</td></tr>`:`<tr><td>${k}</td><td class="dim">—</td><td class="dim">—</td><td class="dim">—</td><td class="dim">—</td></tr>`).join('')+'</tbody>';}
function drawRace(){drawTrack();drawRaceGraphs();drawRaceInfo();}
$('#rPlay').addEventListener('click',()=>{if(RC.t>=TMAX)RC.t=0;RC.run=!RC.run;RC.last=Date.now();drawRace();});
$('#rStep').addEventListener('click',()=>{RC.run=false;RC.t=Math.min(TMAX,Math.floor(RC.t+1e-9)+1);drawRace();});
$('#rReset').addEventListener('click',()=>{RC.run=false;RC.t=0;drawRace();});
$('#rVA').addEventListener('input',e=>{RC.vA=+e.target.value;drawRace();});
$('#rMode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;RC.mode=b.dataset.m;drawRace();});
setInterval(()=>{if(!RC.run)return;const now=Date.now();RC.t=Math.min(TMAX,RC.t+(now-RC.last)/1000);RC.last=now;if(RC.t>=TMAX)RC.run=false;if(!$('#p-race').hidden)drawRace();},50);

/* ================= СРЕДНЯЯ СКОРОСТЬ ================= */
const APRE=()=>({

  <div class="tools">
    <button data-pc="ink" class="pc"><span class="sw"></span></button>
    <button data-pc="red" class="pc"><span class="sw"></span></button>
    <button data-pc="blue" class="pc"><span class="sw"></span></button>
    <button data-pc="green" class="pc"><span class="sw"></span></button>
    <button data-pc="orange" class="pc"><span class="sw"></span></button>
    <button data-pc="violet" class="pc"><span class="sw"></span></button>
    <span class="sep"></span>
    <button data-pw="3" class="pw"><span class="wd" style="width:6px;height:6px"></span></button>
    <button data-pw="6" class="pw"><span class="wd" style="width:11px;height:11px"></span></button>
    <button data-pw="12" class="pw"><span class="wd" style="width:18px;height:18px"></span></button>
    <span class="sep"></span>
    <button id="penEr"><svg viewBox="0 0 24 24"><path d="M7 21h12"/><path d="M5.5 15.5 14 7l5 5-8.5 8.5H7.5z"/><path d="M9.5 11.5l5 5"/></svg></button>
    <button id="penUndo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="penClr"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></button>
    <span class="sep"></span>
  </div>
  <button id="penMain" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M15 4l5 5L9 20H4v-5z"/><path d="M13 6l5 5"/></svg></button>
</div>
<script>
(function(){
  const cv=document.getElementById('penCv'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const LNG=()=>(typeof LANG!=='undefined'&&LANG==='kz')?1:0;
  const TIP={penMain:['Ручка: рисовать на экране (Esc — выключить)','Қалам: экранға жазу (Esc — өшіру)'],penEr:['Ластик','Өшіргіш'],penUndo:['Отменить последнее','Соңғысын болдырмау'],penClr:['Стереть всё на этой вкладке','Осы беттегінің бәрін өшіру'],
    ink:['Чёрный','Қара'],red:['Красный','Қызыл'],blue:['Синий','Көк'],green:['Зелёный','Жасыл'],orange:['Оранжевый','Қызғылт сары'],violet:['Фиолетовый','Күлгін'],w3:['Тонкая линия','Жіңішке сызық'],w6:['Средняя линия','Орташа сызық'],w12:['Толстая линия','Жуан сызық']};
  const COL={ink:['#1c2746','#f1f4fb'],red:['#dc2626','#ff6b6b'],blue:['#2563eb','#7aa2ff'],green:['#15803d','#4ade80'],orange:['#ea580c','#fb923c'],violet:['#7c3aed','#c4a5ff']};
  const mqD=matchMedia('(prefers-color-scheme: dark)');
  const dark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':mqD.matches;};
  const st={on:false,color:'red',w:6,er:false,pages:{},cleared:{},cur:null};
  const key=()=>{const t=document.querySelector('[role="tab"][aria-selected="true"]');return t?(t.id||t.dataset.tab||t.textContent):'main';};
  const list=()=>st.pages[key()]||(st.pages[key()]=[]);
  let dpr=1;
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);redraw();}
  function stroke(s){if(s.p.length===0)return;ctx.save();ctx.globalCompositeOperation=s.er?'destination-out':'source-over';
    ctx.strokeStyle=s.er?'#000':COL[s.c][dark()?1:0];ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';
    const ox=scrollX,oy=scrollY,p=s.p;
    if(p.length===1){ctx.beginPath();ctx.arc(p[0][0]-ox,p[0][1]-oy,s.w/2,0,7);ctx.fill();}
    else{ctx.beginPath();ctx.moveTo(p[0][0]-ox,p[0][1]-oy);for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;ctx.quadraticCurveTo(p[i][0]-ox,p[i][1]-oy,mx-ox,my-oy);}
      const l=p[p.length-1];ctx.lineTo(l[0]-ox,l[1]-oy);ctx.stroke();}
    ctx.restore();}
  function redraw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);list().forEach(stroke);if(st.cur)stroke(st.cur);}
  function tips(){const l=LNG();bar.querySelectorAll('button').forEach(b=>{const k=b.id||(b.dataset.pc)||('w'+b.dataset.pw);const t=TIP[k];if(t){b.title=t[l];b.setAttribute('aria-label',t[l]);}});}
  function ui(){bar.classList.toggle('open',st.on);cv.classList.toggle('on',st.on);cv.classList.toggle('er',st.er);
    document.getElementById('penMain').setAttribute('aria-pressed',st.on);
    bar.querySelectorAll('.pc').forEach(b=>{b.setAttribute('aria-pressed',!st.er&&b.dataset.pc===st.color);b.firstElementChild.style.background=COL[b.dataset.pc][dark()?1:0];});
    bar.querySelectorAll('.pw').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.pw===st.w));
    document.getElementById('penEr').setAttribute('aria-pressed',st.er);tips();}
  bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='penMain'){st.on=!st.on;}
    else if(b.dataset.pc){st.color=b.dataset.pc;st.er=false;}
    else if(b.dataset.pw){st.w=+b.dataset.pw;}
    else if(b.id==='penEr'){st.er=!st.er;}
    else if(b.id==='penUndo'){const L_=list();if(L_.length)L_.pop();else if(st.cleared[key()]){st.pages[key()]=st.cleared[key()];delete st.cleared[key()];}redraw();}
    else if(b.id==='penClr'){if(list().length){st.cleared[key()]=list();st.pages[key()]=[];}redraw();}
    ui();});
  function pt(e){return[e.clientX+scrollX,e.clientY+scrollY];}
  cv.addEventListener('pointerdown',e=>{if(!st.on)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
    const er=st.er||e.button===5||(e.buttons&32);
    st.cur={c:st.color,w:er?Math.max(30,st.w*4):st.w,er,p:[pt(e)]};delete st.cleared[key()];redraw();});
  cv.addEventListener('pointermove',e=>{if(!st.cur)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];(evs.length?evs:[e]).forEach(ev=>st.cur.p.push(pt(ev)));redraw();});
  const end=()=>{if(!st.cur)return;list().push(st.cur);st.cur=null;redraw();};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('lostpointercapture',end);
  addEventListener('scroll',redraw,{passive:true});addEventListener('resize',size);
  addEventListener('keydown',e=>{if(e.key==='Escape'&&st.on){st.on=false;ui();}});
  new MutationObserver(()=>{redraw();ui();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','lang']});
  mqD.addEventListener('change',()=>{redraw();ui();});
  document.querySelectorAll('[role="tab"]').forEach(t=>new MutationObserver(redraw).observe(t,{attributes:true,attributeFilter:['aria-selected']}));
  document.addEventListener('click',e=>{if(e.target.closest('#langSw,[data-lang]'))setTimeout(tips,0);});
  size();ui();
})();
</script>
